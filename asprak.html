<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Asprak | Lab Informatika</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --hitam: #121212;
            --kuning: #FFB800;
            --putih-tulang: #F9F7F2;
            --putih-murni: #FFFFFF;
            --abu-input: #F1F1F1;
        }

        body {
            margin: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--putih-tulang);
            color: var(--hitam);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        /* Tombol Kembali */
        .back-nav {
            position: absolute;
            top: 30px;
            left: 30px;
        }

        .btn-back {
            text-decoration: none;
            color: var(--hitam);
            background: var(--putih-murni);
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #EEE;
        }

        /* Container Form */
        .register-card {
            background: var(--putih-murni);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.05);
            text-align: center;
            position: relative;
            border: 1px solid #F0F0F0;
        }

        .register-card h2 {
            font-weight: 800;
            font-size: 2rem;
            letter-spacing: -1px;
            margin-bottom: 5px;
        }

        .register-card h2 span {
            color: var(--kuning);
        }

        .register-card p {
            color: #777;
            font-size: 0.9rem;
            margin-bottom: 30px;
        }

        /* Form Styling */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 8px;
            margin-left: 5px;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 15px 20px;
            border-radius: 15px;
            border: 1.5px solid var(--abu-input);
            background: var(--abu-input);
            font-family: inherit;
            font-size: 0.9rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--kuning);
            background: #FFF;
            box-shadow: 0 0 0 4px rgba(255, 184, 0, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            border-radius: 15px;
            border: none;
            background: var(--hitam);
            color: var(--kuning);
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        /* Footer Simple */
        .footer-note {
            margin-top: 20px;
            font-size: 0.75rem;
            color: #AAA;
        }

        @media (max-width: 500px) {
            .register-card { padding: 30px 20px; }
            .back-nav { top: 15px; left: 15px; }
        }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> BERANDA</a>
    </div>

    <div class="register-card">
        <h2>JOIN THE <span>CREW</span></h2>
        <p>Pendaftaran Asisten Praktikum Lab Informatika</p>

        <form action="https://formspree.io/f/xkovpaka" method="POST">
            <div class="form-group">
                <label>NAMA LENGKAP</label>
                <input type="text" placeholder="Masukkan nama sesuai KTM" required>
            </div>

            <div class="form-group">
                <label>NIM</label>
                <input type="text" placeholder="3060xxxxxx" required>
            </div>

            <div class="form-group">
                <label>PILIHAN UNIT LAB</label>
                <select required>
                    <option value="" disabled selected>Pilih Unit...</option>
                    <option value="software">Software Engineering</option>
                    <option value="database">Database & Big Data</option>
                    <option value="network">Network & Security</option>
                    <option value="ai">Artificial Intelligence</option>
                </select>
            </div>

            <div class="form-group">
                <label>ALASAN MENDAFTAR</label>
                <textarea rows="3" placeholder="Apa motivasimu bergabung?"></textarea>
            </div>

            <div class="form-group">
                <label>LINK PORTOFOLIO / CV</label>
                <input type="url" placeholder="http://github.com/kamu">
            </div>

            <button type="submit" class="btn-submit">SUBMIT FORM</button>
        </form>

        <div class="footer-note">
            Lab Informatika UNISSULA • 2026
        </div>
    </div>

</body>
</html>
